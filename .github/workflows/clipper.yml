name: gta-clipper

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch: {}       # botão "Run workflow" pra rodar na hora
  push:                       # roda na hora quando o config muda
    branches: [main]
    paths: [config.yaml, "clipper/**", ".github/workflows/clipper.yml"]

concurrency:
  group: gta-clipper
  cancel-in-progress: false

permissions:
  contents: write             # pra salvar state/state.json

jobs:
  rodada:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar ffmpeg e fontes
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Cache do modelo de legenda
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('config.yaml') }}
          restore-keys: whisper-

      - name: Cookies do YouTube (opcional)
        env:
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          if [ -n "$YTDLP_COOKIES" ]; then printf '%s' "$YTDLP_COOKIES" > cookies.txt; fi

      - name: Rodar o clipador
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_EDITOR_ID: ${{ secrets.TWITCH_EDITOR_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          METRICOOL_TOKEN: ${{ secrets.METRICOOL_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          YTDLP_COOKIES_FILE: cookies.txt
        run: python -m clipper.main

      - name: Salvar memória do robô
        if: always()
        run: |
          rm -f cookies.txt
          git config user.name "gta-clipper-bot"
          git config user.email "gta-clipper-bot@users.noreply.github.com"
          git add state/state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "estado: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -q && git push -q
          fi
