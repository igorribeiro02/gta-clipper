# ==========================================================
#  GTA CLIPPER — configuração
#  Edite este arquivo direto no GitHub (ícone de lápis).
# ==========================================================

# "aprovacao"  -> cada corte vai pro Metricool como RASCUNHO com data/hora.
#                 Você revisa no app do Metricool e aprova.
# "automatico" -> cada corte é agendado e sai sozinho no horário.
modo: aprovacao

fuso: America/Sao_Paulo

# Redes onde cada corte será postado (via Metricool)
redes: [tiktok, instagram, youtube]

# Horários fixos de postagem ao longo do dia (cada corte ocupa um horário)
postagem:
  horarios: ["08:30", "11:30", "13:00", "16:00", "18:30", "20:00", "21:30", "23:00"]
  max_por_dia: 8
  max_por_streamer_por_dia: 3
  max_cortes_por_execucao: 3      # quantos cortes renderizar a cada rodada (30 min)
  antecedencia_minima_min: 20     # não agenda nada pra daqui a menos de X minutos
  tiktok_privacidade: PUBLIC_TO_EVERYONE

# Filtros de qualidade
filtros:
  janela_horas: 30         # só considera clipes criados nas últimas X horas
  views_minimas_twitch: 30
  views_minimas_kick: 30
  duracao_min_s: 10
  duracao_max_s: 75

# Estilo do vídeo
video:
  duracao_alvo_s: 38       # corta só o trecho mais forte do clipe (volume + fala)
  facecam_auto: true       # acha a câmera do streamer e faz tela dividida (streamer em cima)
  capa_estilo: arte        # arte = capa original desenhada (sem copyright) | quadro = frame da live
  capa: true               # gera capa com o gancho gigante no quadro de pico
  legendas: true           # transcreve o áudio e queima legenda estilo TikTok
  modelo_whisper: small    # tiny | base | small (small = melhor custo/benefício)
  idioma: pt
  hashtags: ["#gta6", "#gtavi", "#gta", "#gtarp", "#cortes", "#rockstargames"]

# Temas em alta (pesquisa vidIQ 18–19/11: o que mais viralizou em cortes de GTA 6 no Brasil).
# Clipe cujo título/fala bate com um tema sobe na fila e ganha as hashtags do tema.
temas_em_alta:
  - nome: bugs
    palavras: ["bug", "bugou", "glitch", "travou", "injogável"]
    hashtags: ["#bugsgta6", "#gta6bugs"]
  - nome: npcs e realismo
    palavras: ["npc", "realista", "realismo", "detalhe", "geladeira", "cabelo"]
    hashtags: ["#npcgta6", "#detalhesgta6"]
  - nome: mapa e lugares
    palavras: ["mapa", "praia", "vice city", "leonida", "miami", "cidade"]
    hashtags: ["#vicecity", "#mapagta6"]
  - nome: polícia e perseguição
    palavras: ["polícia", "policia", "fuga", "fugir", "preso", "estrela", "perseguição"]
    hashtags: ["#perseguicao", "#gta6policia"]
  - nome: carros e aviões
    palavras: ["carro", "avião", "aviao", "moto", "barco", "helicóptero", "bati", "capotou"]
    hashtags: ["#carrosgta6"]
  - nome: códigos e segredos
    palavras: ["cheat", "código", "codigo", "segredo", "easter egg", "escondido"]
    hashtags: ["#cheatsgta6", "#easteregg"]

# Clipes que o robô NÃO deve usar (ex.: conteúdo sensual/18+ que derruba conta nova)
pular:
  - "kick:clip_01M7SNVFD8NQGRGY98AKM6W4SG"
  - "kick:clip_01M7SNV030669FZM5KDVKCXXJ2"

# Textos escritos à mão para um clipe específico (sobrescreve o automático)
ganchos_manuais:
  "kick:clip_01M7SFMAS45A904V70KC8FMSSV":
    gancho: "O COMEÇO DO GTA 6 COM O CORINGA"
    legenda: "O Coringa começando o GTA 6 e o Jason já querendo vida de rico 😂"
    titulo: "O começo do GTA 6 com o Coringa 😂 #shorts"

# ----------------------------------------------------------
# Streamers. O robô SÓ clipa quem tiver "autorizado: true".
#   autorizado:      true = autorizou por mensagem OU libera cortes
#                    publicamente (bio, painel da Twitch, Discord)
#   onde_autorizou:  onde está a prova (guarde o print!)
#   plataforma: twitch | kick | youtube
#   canal:      login da Twitch, slug da Kick ou @handle do YouTube
#   facecam:    opcional. Posição da câmera na tela, em frações (0 a 1):
#               [x, y, largura, altura]. Ex.: câmera no canto inferior
#               direito ocupando 25% x 30% -> [0.75, 0.70, 0.25, 0.30]
#               Sem facecam = vídeo centralizado com fundo desfocado.
#   editor:     true se o streamer te colocou como editor na Twitch
#               (libera o download oficial pela API)
# ----------------------------------------------------------
streamers:
  # Autorização informada pelo Igor em 20/11/2026 — guarde os prints!
  - nome: Coringa
    plataforma: kick
    canal: coringa
    autorizado: true
    onde_autorizou: "autorização direta ao Igor (20/11/2026)"

  - nome: Davy Jones
    plataforma: twitch
    canal: davyjones
    autorizado: true
    onde_autorizou: "autorização direta ao Igor (20/11/2026)"
    editor: false

  # Campos opcionais por streamer:
  #   idioma: en            -> legenda em inglês (streamer gringo de campanha paga)
  #   aviso: "Parceria paga"  -> texto obrigatório de campanha (Content Rewards etc.)
  #   hashtags: ["#loud"]   -> hashtags extras desse streamer
  # Modelo pra novos streamers:
  # - nome: Fulano
  #   plataforma: twitch        # twitch | kick | youtube
  #   canal: fulano
  #   autorizado: true
  #   onde_autorizou: "painel da Twitch: cortes liberados (print salvo 20/11)"
  #   facecam: [0.75, 0.70, 0.25, 0.30]
